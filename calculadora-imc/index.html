<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
</head>
<body>
    <form onsubmit="return calcular(event)">
        <label for="">Digite seu peso</label>
        <input type="text" name="peso" id="peso"><br><br>

         <label for="">Digite sua altura</label>
        <input type="text" name="altura" id="altura"><br><br>

        <input type="submit" name="" id="" value="Calcular IMC"><br>

    </form>
    <div id="resultado"></div>
    <script src="./script.js"></script>
</body>
</html>
